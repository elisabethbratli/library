# Local development: docker compose up --build  ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: library, POSTGRES_USER: library, POSTGRES_PASSWORD: library }
    volumes: [dbdata:/var/lib/postgresql/data]
  api:
    build: backend/Library.Api
    environment:
      ConnectionStrings__Library: Host=db;Database=library;Username=library;Password=library
    depends_on: [db]
  web:
    build: frontend
    environment: { API_UPSTREAM: "http://api:8080", API_HOST: api }
    ports: ["8080:8080"]
    depends_on: [api]
volumes:
  dbdata:
